services:
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    container_name: seerr
    user: 5006:5006
    ports:
      - 5055:5055
    dns:
      - 1.1.1.1
    volumes:
      - ./config:/app/config
    read_only: true
    security_opt:
      - no-new-privileges=true
    environment:
      - PUID=5006
      - PGID=5006
      - LOG_LEVEL=info
      - TZ=${TZ}
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    restart: 'on-failure:5'
