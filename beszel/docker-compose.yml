services:
  beszel:
    image: henrygd/beszel
    container_name: beszel
    user: 5005:5005
    ports:
      - 8090:8090
    env_file: ".env"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./beszel_data:/beszel_data
    environment:
      - APP_URL=${APP_URL}
      - USER_CREATION=true
      - DISABLE_PASSWORD_AUTH=false
    restart: unless-stopped
